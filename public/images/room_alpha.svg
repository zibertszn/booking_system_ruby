<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgAlpha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgAlpha)"/>
  <!-- Architectural grid lines -->
  <line x1="80" y1="0" x2="80" y2="600" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <line x1="720" y1="0" x2="720" y2="600" stroke="#334155" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#334155" stroke-width="1.5"/>
  <!-- 4K Conference Display -->
  <rect x="210" y="95" width="380" height="215" rx="8" fill="#090d16" stroke="#475569" stroke-width="4"/>
  <rect x="222" y="107" width="356" height="191" rx="4" fill="url(#screenGlow)" opacity="0.85"/>
  <!-- Screen UI schematic -->
  <rect x="245" y="130" width="145" height="95" rx="4" fill="#e0f2fe" opacity="0.2"/>
  <rect x="405" y="130" width="150" height="95" rx="4" fill="#e0f2fe" opacity="0.2"/>
  <rect x="245" y="240" width="310" height="36" rx="4" fill="#0f172a" opacity="0.45"/>
  <!-- Logitech MeetUp Soundbar -->
  <rect x="340" y="322" width="120" height="16" rx="8" fill="#64748b"/>
  <circle cx="400" cy="330" r="5" fill="#38bdf8"/>
  <!-- Conference Table -->
  <polygon points="150,470 650,470 730,570 70,570" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="62" fill="#94a3b8" font-family="monospace" font-size="15">ЗАЛ 302 · ПЕРЕГОВОРНАЯ АЛЬФА · 10 МЕСТ</text>
</svg>
