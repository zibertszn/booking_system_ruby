default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "123") %>
<% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
<% end %>

development:
  <<: *default
  database: booking_project_development

test:
  <<: *default
  database: booking_project_test

production:
  <<: *default
  database: booking_project_production
  username: booking_project
  password: <%= ENV["BOOKING_PROJECT_DATABASE_PASSWORD"] %>
